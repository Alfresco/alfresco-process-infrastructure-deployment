name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ee10ec96d25c2cdfc6f45d3398aae1c6190f4d5d # v10.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
