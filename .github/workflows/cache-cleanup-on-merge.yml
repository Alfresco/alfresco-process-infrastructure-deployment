name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@166e610d3eebb2a561d6daba97cd58d98ef2db14 # v8.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
