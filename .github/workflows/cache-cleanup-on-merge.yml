name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@8d76614b374e521d792b4a1c9827409960b66bae # v17.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
