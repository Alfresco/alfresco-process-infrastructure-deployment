name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@8c848a8758cf4228962e96f73b6004bb814d60d8 # v17.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
