name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@3bbbfc459dd15452e68e3cefcbc56596d88d71ee # v19.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
