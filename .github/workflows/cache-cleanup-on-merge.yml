name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a32503e10c10dc999ffcdfa8bc8c5e705cf36928 # v8.31.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
