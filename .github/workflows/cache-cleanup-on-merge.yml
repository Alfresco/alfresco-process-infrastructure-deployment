name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@2cebc8f19812b2653361d82e86b25f29cfa4a144 # v19.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
