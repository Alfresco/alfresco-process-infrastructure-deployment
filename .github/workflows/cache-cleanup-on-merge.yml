name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@c2278c8ec6744d3595478217e9736ebb47d501db # v8.23.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
