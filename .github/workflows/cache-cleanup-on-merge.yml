name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@684d64a56c85be82826d46ea1b95fa7c11dcc10c # v18.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
