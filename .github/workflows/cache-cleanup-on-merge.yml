name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@1d671f8f10336861c89c67be57c6648d98876103 # v18.19.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
