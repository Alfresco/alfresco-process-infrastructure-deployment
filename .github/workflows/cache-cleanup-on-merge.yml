name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@95f68dc050fba62b3331d9b47bc659526cdfb343 # v8.21.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
