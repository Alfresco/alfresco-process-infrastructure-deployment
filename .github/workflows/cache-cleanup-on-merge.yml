name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@c388af5fcce6747d0059ae98db2857fc9e8a9387 # v18.28.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
