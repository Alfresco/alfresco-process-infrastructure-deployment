name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@2feb132e561953e16eaea6f3f0b9ae7e61034267 # v12.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
