name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@f1bae5a4bdb3b12030a350e52b8f661dbcb2f849 # v18.28.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
