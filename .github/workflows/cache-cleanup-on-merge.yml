name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@16298278308f674c76542d61658da190e975e31c # v19.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
