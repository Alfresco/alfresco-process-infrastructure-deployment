name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@d068875e2ee3aebca13f10600afe0deb083b7dc7 # v15.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
