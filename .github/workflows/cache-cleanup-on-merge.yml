name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@1c04aea07c20165ca364dacdd4618f9df5d1b8f6 # v8.30.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
