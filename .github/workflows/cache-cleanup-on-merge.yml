name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@1c7cd7fb5f8130b8ddc9d512ecb958c12fc18e89 # v12.10.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
