name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@11231bfa6b383b7073a117ac38493c948e791479 # v12.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
