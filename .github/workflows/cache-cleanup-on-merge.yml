name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@62d25370db3ca229de518fab5b32ec014a061101 # v8.33.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
