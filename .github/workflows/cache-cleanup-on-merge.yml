name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@15e09b8065507210cb1cc33c8bc778b1fb4f289d # v8.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
