name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@6893e3d493fc1e1e930123bbbd20c32805116860 # v10.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
