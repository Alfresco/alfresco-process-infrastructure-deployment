name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@3cde61e1d1eb54a5bea2f15e528e0e3ed0b9baa1 # v12.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
