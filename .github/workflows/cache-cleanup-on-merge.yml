name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@d2fd6744fbbb6a0c874c1e28f5374210e2743c2f # v17.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
