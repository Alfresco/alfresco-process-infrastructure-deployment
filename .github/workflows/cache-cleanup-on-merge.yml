name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@6a31fc8a9e6ecf521d09eb05efbbe76541aed668 # v12.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
