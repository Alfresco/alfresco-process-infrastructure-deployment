name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@cbb71914f9d69a6ccb415fdd16ba930fa964aa4e # v8.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
