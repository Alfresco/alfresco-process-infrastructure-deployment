name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@4657bc5c89f722332e897d8f360b75f08e81b8b9 # v12.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
