name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@10cea6c0b390c4f8af21d9dc1670d581bd10319f # v18.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
