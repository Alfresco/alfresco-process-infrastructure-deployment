name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@9e15988fdf503869a04a9106daa9b06cfdb1768c # v11.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
