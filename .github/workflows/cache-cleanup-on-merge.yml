name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@1b252f8b41806ff7172e7a508e0d3d3e0b3e1588 # v18.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
