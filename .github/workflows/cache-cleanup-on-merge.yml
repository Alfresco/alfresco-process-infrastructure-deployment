name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@800d7f17549f77367edfb0ad788cf627bc3defe0 # v8.17.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
