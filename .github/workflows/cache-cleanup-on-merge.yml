name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@7e012168d1ffb0e5bd4a91949ac9d5c57cdc9cc5 # v15.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
