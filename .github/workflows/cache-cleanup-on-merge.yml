name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@bebd6c2fddd0a58ecf7f0acfc511a019f6afc180 # v9.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
