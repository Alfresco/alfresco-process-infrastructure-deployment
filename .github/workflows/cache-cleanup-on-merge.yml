name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@7bb0d8f13a52db230cff8d3e2895880d6a11c66a # v9.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
