name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@695272dc5144fc5484e4ea610ae82715fb6294c8 # v8.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
