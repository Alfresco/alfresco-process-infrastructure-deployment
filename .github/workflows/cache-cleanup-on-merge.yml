name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@3ff1eb0e5f9d61a685e03c13b4fad6f0fb8450ee # v18.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
