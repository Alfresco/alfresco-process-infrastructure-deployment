name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@768b583839a22ef7d882da0c5b82af3832197d00 # v19.7.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
