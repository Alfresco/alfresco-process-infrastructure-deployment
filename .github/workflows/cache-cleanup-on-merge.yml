name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@4cd0343f092e3a2b9637019f87a1fad908227c42 # v11.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
