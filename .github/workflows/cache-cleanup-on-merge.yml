name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@b7013d54c5255a71f931fd1316d0fcdb5c36c13c # v15.9.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
