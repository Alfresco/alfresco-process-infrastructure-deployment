name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@1d9c885c3368664da6c9cb7ce350edd2a9796fa0 # v15.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
