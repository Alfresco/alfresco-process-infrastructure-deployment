name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@7eb56e49e47d11547d61c3c68826022db830fc15 # v10.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
