name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@499eb5d58f3f82a4efa4eaedab26dbecff18328c # v18.15.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
