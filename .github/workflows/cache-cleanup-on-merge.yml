name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@e9fbe00d887797858a4fa3d2c30035305d526a6d # v8.8.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
