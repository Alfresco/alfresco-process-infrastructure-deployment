name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@5d33aec6cf9ffd70982c404ebf5ebadedd7405d9 # v19.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
