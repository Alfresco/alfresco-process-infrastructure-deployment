name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@45b096a6666afcf321d6979aedda63b0998d3c60 # v12.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
