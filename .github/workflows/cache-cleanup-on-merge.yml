name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a297ff6c5bf20c667047db658dd23f60241b270a # v18.28.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
