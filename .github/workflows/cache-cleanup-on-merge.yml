name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@e6c249ac22c6e4d3b4932c16012d1450f8b0a12a # v9.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
