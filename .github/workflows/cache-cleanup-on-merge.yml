name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@1eb2a2712c56e1af896397ee05b6e7d34def6fa7 # v9.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
