name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@8cd8c3798c79d10540e2876ad7cf2a5311cbd1ae # v8.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
