name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@b3070acf733fdcfd2698065e99017d4969256e5b # v8.22.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
