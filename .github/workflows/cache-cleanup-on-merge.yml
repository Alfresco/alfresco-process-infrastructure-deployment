name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@76a3136ee197dc9e8cbe30f004ff16b916213f09 # v8.32.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
