name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@e87345fb177248fc5bdc7838107f098438818df1 # v18.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
