name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@661ab6a0d23f6a269da039831907cffad37cc061 # v15.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
