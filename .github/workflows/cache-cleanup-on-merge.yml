name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@0f483aca096ad614dbee2a4b0c9222437c285d1c # v15.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
