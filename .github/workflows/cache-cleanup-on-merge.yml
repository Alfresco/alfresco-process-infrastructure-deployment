name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@3d656a453714a40052886d698f3950741890e159 # v8.23.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
