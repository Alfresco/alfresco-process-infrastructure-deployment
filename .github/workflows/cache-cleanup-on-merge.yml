name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@29e77d9158142e043783ea9eb831535b06474860 # v8.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
