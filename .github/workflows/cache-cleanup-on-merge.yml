name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@7e6cfc6dc78dd63baf3e7193e85f6a630e46c41e # v15.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
