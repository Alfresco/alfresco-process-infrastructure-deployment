name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@de2559fee73a07043a86f828c38fcf02f7256acb # v8.28.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
