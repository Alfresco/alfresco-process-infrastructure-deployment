name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@20d21f43addae05442096a7e935dc2b321361501 # v8.27.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
