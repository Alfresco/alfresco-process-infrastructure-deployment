name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@691c1d16c90c88a92d2438a001acdefc0efa7d2a # v8.26.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
