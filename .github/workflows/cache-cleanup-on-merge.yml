name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@03cc498daae9f1b06424f352d944e403b458b825 # v12.8.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
