name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@404d1b3f278711e3f845cbb546ef3512af7ef59e # v15.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
