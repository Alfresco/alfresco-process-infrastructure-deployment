name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@09293790e3d482b6376a602f607e009ef1025698 # v8.19.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
