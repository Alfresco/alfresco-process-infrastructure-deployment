name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@8222464f96aac2087ae1b5669b9ba74b252c4aca # v9.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
