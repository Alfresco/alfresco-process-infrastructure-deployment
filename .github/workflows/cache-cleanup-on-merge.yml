name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a6bffde20ba60a32bde4ea31e26204ecf1d96673 # v8.29.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
