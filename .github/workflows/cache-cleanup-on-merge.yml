name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ce7f6e0b62727da8600acf87d72ffbf064ac34b5 # v8.33.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
