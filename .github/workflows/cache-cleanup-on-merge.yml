name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@5c6f19b3057be9900f796c7bcef548a476a3edc9 # v8.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
