name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@c1236aee36bb9b35c5972819fcf8a4d07572e6cd # v8.16.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
