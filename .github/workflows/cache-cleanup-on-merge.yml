name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@16272633584df58ea603112c4aac4564c8673cd6 # v8.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
