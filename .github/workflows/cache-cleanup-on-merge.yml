name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ac971d319df1ef3b69104c7b0510348191d78952 # v8.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
