name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@cf10f6e1c1591d01d92fd4abc0847b1ae75d04da # v8.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
