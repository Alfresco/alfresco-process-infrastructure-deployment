name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@771589f55625d6b787ce535b2f7a1c595996ea67 # v12.10.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
