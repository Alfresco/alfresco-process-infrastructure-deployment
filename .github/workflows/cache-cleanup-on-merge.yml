name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@f95467b62527ce087c9a1b7e55c467061cf827a0 # v17.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
