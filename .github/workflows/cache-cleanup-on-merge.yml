name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ea211659654c7d82fc7241455140cf08064d9598 # v12.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
