name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ed7779a4bda83d699c1acaf72922ef21636a3dc2 # v18.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
