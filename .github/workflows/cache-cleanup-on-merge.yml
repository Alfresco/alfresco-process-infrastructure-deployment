name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@09ecb59ac62d18a4c685f5e859383497f4f360c9 # v9.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
