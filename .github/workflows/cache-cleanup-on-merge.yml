name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@9904c5c6fb2d8853e02ed4d9e225e5f644cda1b8 # v14.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
