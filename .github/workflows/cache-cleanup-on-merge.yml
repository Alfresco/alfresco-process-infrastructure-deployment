name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@482401ef42e6503cfa54d5873f1a768a0ecb3e0e # v19.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
