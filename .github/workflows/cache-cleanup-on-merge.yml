name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@bdb0d63c3c8da3a7b802b83fa1350a7dfdc578ed # v8.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
