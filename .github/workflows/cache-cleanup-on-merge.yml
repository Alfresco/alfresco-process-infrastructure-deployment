name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@247f59bac145315d38078f8954c763e0db57d5f1 # v8.18.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
