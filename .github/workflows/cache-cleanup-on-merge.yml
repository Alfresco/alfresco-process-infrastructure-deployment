name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@339e93fda1d8a24d0feead6447afb493f5ade20e # v8.28.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
