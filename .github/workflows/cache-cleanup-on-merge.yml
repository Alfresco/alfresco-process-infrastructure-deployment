name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ed80b0eef8e432f517ea1aa51d8a82637c1d1cc1 # v18.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
