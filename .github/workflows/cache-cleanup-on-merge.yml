name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a3d5beb67a8b8d96398435e01686a9a9185380ab # v8.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
