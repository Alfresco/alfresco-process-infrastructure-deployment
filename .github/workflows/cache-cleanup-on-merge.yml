name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@82491bfaf83545aa572e68da8f750a0117abdb90 # v8.35.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
