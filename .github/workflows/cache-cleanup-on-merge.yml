name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@1f44b3bf73b5849337994b7e0c7584dc6ccb5ae9 # v17.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
