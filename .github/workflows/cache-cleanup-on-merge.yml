name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@5ee7dc98536d9d7dc81ba3fc2c2866f8315626a3 # v8.24.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
