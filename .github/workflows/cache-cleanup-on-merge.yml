name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@c9a680085778995856d8b0367dd7fa737b441b08 # v15.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
