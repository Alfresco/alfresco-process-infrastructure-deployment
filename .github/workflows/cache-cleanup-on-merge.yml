name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@c00625b5f30db226fb0634299effc4cd15fdd7bb # v17.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
