name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@cf2874eecdcfeef37c76bfb19cf07e98545042ee # v8.36.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
