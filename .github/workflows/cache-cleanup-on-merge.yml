name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@012ce56cc25c63d5881d1ec391e2eb4c0254810d # v8.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
