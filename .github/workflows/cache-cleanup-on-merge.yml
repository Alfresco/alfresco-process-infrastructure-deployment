name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@4e61fa01622e3f3a1898eb059d9a3af208897515 # v18.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
