name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@86fa01feca860df31191c605eaae854f7611b01e # v8.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
