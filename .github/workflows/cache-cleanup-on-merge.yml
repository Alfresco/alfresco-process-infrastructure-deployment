name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ffc4f9974da0c6fe311fb66e119547a2e8c126c8 # v12.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
