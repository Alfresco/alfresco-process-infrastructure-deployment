name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@09cfe8ab1d2b7105052c7bd79281cd1e16c68e11 # v9.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
