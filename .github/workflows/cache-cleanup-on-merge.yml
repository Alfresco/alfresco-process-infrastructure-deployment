name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@e5221d8092e0529c67dceb9a61d552f1d81e291a # v14.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
