name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@45bb8b664779b691f8a21d9fd49e360916726c11 # v8.18.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
