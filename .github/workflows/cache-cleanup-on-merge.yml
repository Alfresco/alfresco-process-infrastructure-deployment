name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@9f51752cb7845dce8e8b13b866c127681f418bb3 # v17.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
