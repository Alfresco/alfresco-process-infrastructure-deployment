name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@edb17074b511e2443b0dbaed57772b9f0b1d017a # v8.35.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
