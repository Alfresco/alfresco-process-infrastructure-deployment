name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a8bc14631a9ce72275346e536607c4527591112a # v18.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
