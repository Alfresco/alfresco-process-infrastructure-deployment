name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@553f5072e26f29e8a4085dba3137b99a9b9b198e # v12.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
