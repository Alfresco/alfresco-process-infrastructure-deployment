name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@0a252c56211c9dd7f5da259692c8b97765dd4afc # v8.32.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
