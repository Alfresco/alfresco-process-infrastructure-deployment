name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a6a8be7429080c132815d0482a55ae4fd28f15ba # v18.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
