name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@f2ba011b2bd8bee8d7418b046541ce2f75d1fbed # v19.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
