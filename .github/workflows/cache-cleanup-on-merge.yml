name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@bbb4eed7a36d87eddec4a607553f519b0323dfb0 # v12.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
