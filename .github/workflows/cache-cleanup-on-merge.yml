name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a96753d4d1c98384249ea8370b5d605866b63e1e # v8.8.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
