name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@2af2665b32a2566efdc5f23d8226a23c055706ea # v8.22.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
