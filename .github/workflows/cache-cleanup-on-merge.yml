name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@900580fcf2b637714a0198ff42e705f37aec7f5b # v8.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
