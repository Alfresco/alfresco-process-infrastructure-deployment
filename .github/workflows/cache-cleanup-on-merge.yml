name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@5dba8511d58cb54589178d7ac339695ef52b12ef # v15.6.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
