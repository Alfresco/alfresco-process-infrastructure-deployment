name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@b8c3a89596708e92238c2a16c8c659772ba7d0d8 # v8.32.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
