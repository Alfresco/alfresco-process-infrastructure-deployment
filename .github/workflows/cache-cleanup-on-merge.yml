name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@b51dfeef6bda4a506778050a1c0e53eed440598c # v11.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
