name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@a2ada4a9158a651f9688d1f870e7b583f9a5422b # v8.28.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
