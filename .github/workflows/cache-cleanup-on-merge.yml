name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@fd5878fdc8b6de4d27591c5100434f31019f1f28 # v12.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
