name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@e524cd3bb34350e247b0348cc8e4a6e0b4fd6c42 # v8.18.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
