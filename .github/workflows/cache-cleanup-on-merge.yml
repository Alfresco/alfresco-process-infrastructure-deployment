name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@09e9ddb45b19dbd2b0f4648aaf6a4185bcd9db03 # v10.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
