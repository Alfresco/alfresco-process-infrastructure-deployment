name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@162d01f0dd3d9ead7526be3b046743fae5afb2cd # v18.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
