name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@40f2376b812403b51e0cea49eaff04c1b8d65cfd # v15.7.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
