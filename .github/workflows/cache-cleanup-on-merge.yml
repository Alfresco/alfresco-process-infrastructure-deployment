name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@ac0009fd55b474dbf50864caa4f9da36a41e5ffe # v18.21.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
