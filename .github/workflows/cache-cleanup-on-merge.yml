name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@f37c44cc085236178ebb8834eb634b0b4b550a40 # v8.23.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
