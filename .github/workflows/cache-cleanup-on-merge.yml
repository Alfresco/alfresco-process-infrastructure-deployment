name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@de5e037bf9a2ac174c1993dab82002a2278a6506 # v9.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
