name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@9b6e121be0110b74dd497fce503d7671cb861368 # v15.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
