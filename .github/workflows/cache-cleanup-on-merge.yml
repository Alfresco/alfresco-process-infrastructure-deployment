name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@cc62a3c7b95907087377af6c5aeebcbfd76129b1 # v8.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
