name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@348e767723102af8cff995773904a2c16b098d11 # v9.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
