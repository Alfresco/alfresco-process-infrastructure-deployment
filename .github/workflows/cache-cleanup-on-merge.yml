name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@d2333816055ff07f7497ff8f8176f789dbe7e811 # v12.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
