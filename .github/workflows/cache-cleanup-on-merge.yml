name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@c9e19a0e7e1dbbe93a01059cc8084730a7482cfa # v12.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
