name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@9d08e878673ab3718a1b2e462acea790ca57ce41 # v15.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
