name: Cleanup caches for work branch
on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/gh-cache-cleanup-on-merge@2cb399462d8e86e9f6e75bcf29ce60e263fe0d0e # v8.34.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
